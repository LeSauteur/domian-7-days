name: Validate data and calendar
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/export-days.js --check
      - run: node tests/days-export.test.js
      - run: node tests/calendar.test.js
